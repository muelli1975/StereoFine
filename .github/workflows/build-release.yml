name: Build StereoFine 1.0

env:
  EXIFTOOL_VERSION: '13.59'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-release.yml'
      - 'tests/test_release_hygiene.py'
      - 'assets/stereofine.jpg'
      - 'assets/stereofine.ico'
      - 'assets/ready.wav'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify original StereoFine assets
        run: cd assets && sha256sum -c ASSET_HASHES.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile and import
        run: |
          python -m compileall -q StereoFine.py stereofine tests
          python - <<'PY'
          import importlib, pkgutil, stereofine
          mods = [m.name for m in pkgutil.iter_modules(stereofine.__path__, stereofine.__name__ + '.')]
          for name in sorted(mods):
              importlib.import_module(name)
          print(f'Imported {len(mods)} StereoFine modules')
          PY

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install portable ExifTool
        shell: pwsh
        run: |
          $version = '${{ env.EXIFTOOL_VERSION }}'
          $url = "https://sourceforge.net/projects/exiftool/files/exiftool-${version}_64.zip/download"
          curl.exe -fL $url -o exiftool.zip
          Expand-Archive exiftool.zip -DestinationPath exiftool-download
          $pkg = Get-ChildItem exiftool-download -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item -Recurse -Force (Join-Path $pkg.FullName '*') tools
          $exe = Get-ChildItem tools -File | Where-Object { $_.Name -like 'exiftool*.exe' } | Select-Object -First 1
          if (-not $exe) { throw 'ExifTool executable not found after extraction' }
          Rename-Item -Force $exe.FullName 'exiftool.exe'
          & .\tools\exiftool.exe -ver
      - name: Build portable Windows release
        shell: pwsh
        run: .\build_windows.ps1
      - name: Rename artifact
        shell: pwsh
        run: Move-Item release\StereoFine_1.0.zip release\StereoFine_1.0_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StereoFine_1.0_Windows_x64
          path: release/StereoFine_1.0_Windows_x64.zip
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare portable ExifTool
        run: |
          VERSION='${{ env.EXIFTOOL_VERSION }}'
          ARCHIVE="Image-ExifTool-${VERSION}.tar.gz"
          curl -fL "https://sourceforge.net/projects/exiftool/files/${ARCHIVE}/download" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          mkdir -p portable-tools/lib
          cp "Image-ExifTool-${VERSION}/exiftool" portable-tools/exiftool
          cp -R "Image-ExifTool-${VERSION}/lib/." portable-tools/lib/
          chmod +x portable-tools/exiftool
          perl portable-tools/exiftool -ver
      - name: Build Linux x64
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name StereoFine \
            --collect-data customtkinter \
            --add-data 'assets:assets' \
            StereoFine.py
          mv dist/StereoFine dist/StereoFine_1.0_Linux_x64
          mkdir -p dist/StereoFine_1.0_Linux_x64/tools
          cp -R portable-tools/* dist/StereoFine_1.0_Linux_x64/tools/
          cp README_DE.md README_EN.md LICENSE.txt THIRD_PARTY_NOTICES.md dist/StereoFine_1.0_Linux_x64/
          cp -R licenses dist/StereoFine_1.0_Linux_x64/licenses
          tar -C dist -czf StereoFine_1.0_Linux_x64.tar.gz StereoFine_1.0_Linux_x64
      - uses: actions/upload-artifact@v4
        with:
          name: StereoFine_1.0_Linux_x64
          path: StereoFine_1.0_Linux_x64.tar.gz
          if-no-files-found: error

  mac-arm64:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare portable ExifTool
        run: |
          VERSION='${{ env.EXIFTOOL_VERSION }}'
          ARCHIVE="Image-ExifTool-${VERSION}.tar.gz"
          curl -fL "https://sourceforge.net/projects/exiftool/files/${ARCHIVE}/download" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          mkdir -p portable-tools/lib
          cp "Image-ExifTool-${VERSION}/exiftool" portable-tools/exiftool
          cp -R "Image-ExifTool-${VERSION}/lib/." portable-tools/lib/
          chmod +x portable-tools/exiftool
          perl portable-tools/exiftool -ver
      - name: Build macOS Apple Silicon
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name StereoFine \
            --collect-data customtkinter \
            --add-data 'assets:assets' \
            --icon assets/stereofine.ico \
            StereoFine.py
          APP='dist/StereoFine.app'
          test -d "$APP"
          mkdir -p "$APP/Contents/MacOS/tools"
          cp -R portable-tools/* "$APP/Contents/MacOS/tools/"
          mkdir -p package
          cp -R "$APP" package/
          cp README_DE.md README_EN.md LICENSE.txt THIRD_PARTY_NOTICES.md package/
          cp -R licenses package/licenses
          ditto -c -k --sequesterRsrc --keepParent package StereoFine_1.0_macOS_AppleSilicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StereoFine_1.0_macOS_AppleSilicon
          path: StereoFine_1.0_macOS_AppleSilicon.zip
          if-no-files-found: error

  mac-intel:
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare portable ExifTool
        run: |
          VERSION='${{ env.EXIFTOOL_VERSION }}'
          ARCHIVE="Image-ExifTool-${VERSION}.tar.gz"
          curl -fL "https://sourceforge.net/projects/exiftool/files/${ARCHIVE}/download" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          mkdir -p portable-tools/lib
          cp "Image-ExifTool-${VERSION}/exiftool" portable-tools/exiftool
          cp -R "Image-ExifTool-${VERSION}/lib/." portable-tools/lib/
          chmod +x portable-tools/exiftool
          perl portable-tools/exiftool -ver
      - name: Build macOS Intel
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name StereoFine \
            --collect-data customtkinter \
            --add-data 'assets:assets' \
            --icon assets/stereofine.ico \
            StereoFine.py
          APP='dist/StereoFine.app'
          test -d "$APP"
          mkdir -p "$APP/Contents/MacOS/tools"
          cp -R portable-tools/* "$APP/Contents/MacOS/tools/"
          mkdir -p package
          cp -R "$APP" package/
          cp README_DE.md README_EN.md LICENSE.txt THIRD_PARTY_NOTICES.md package/
          cp -R licenses package/licenses
          ditto -c -k --sequesterRsrc --keepParent package StereoFine_1.0_macOS_Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StereoFine_1.0_macOS_Intel
          path: StereoFine_1.0_macOS_Intel.zip
          if-no-files-found: error

  release:
    needs: [windows, linux, mac-arm64, mac-intel]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: StereoFine_1.0_*
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            gh release upload v1.0 artifacts/* --clobber
          else
            gh release create v1.0 artifacts/* \
              --target "$GITHUB_SHA" \
              --title 'StereoFine 1.0' \
              --notes-file RELEASE_NOTES_1.0.md
          fi
