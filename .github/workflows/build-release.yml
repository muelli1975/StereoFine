name: Build StereoFine 1.1-rc2

env:
  EXIFTOOL_VERSION: '13.59'

on:
  workflow_dispatch:
  push:
    branches: [development/1.1]
    paths:
      - '.github/workflows/build-release.yml'
      - 'stereofine/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - 'build_windows.ps1'
      - 'version_info.txt'
      - 'RELEASE_NOTES_1.1-rc2.md'
      - 'assets/stereofine.jpg'
      - 'assets/stereofine.ico'
      - 'assets/stereofine.icns'
      - 'assets/ready.wav'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify original StereoFine assets
        run: cd assets && sha256sum -c ASSET_HASHES.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile and import
        run: |
          python -m compileall -q StereoFine.py stereofine tests
          python - <<'PY'
          import importlib, pkgutil, stereofine
          mods = [m.name for m in pkgutil.iter_modules(stereofine.__path__, stereofine.__name__ + '.')]
          for name in sorted(mods):
              importlib.import_module(name)
          print(f'Imported {len(mods)} StereoFine modules')
          PY

      - name: GUI smoke DE and EN
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          PYTHONPATH=. STEREOFINE_TEST_LANGUAGE=de xvfb-run -a -s '-screen 0 1920x1080x24' python tests/gui_smoke_xvfb.py
          PYTHONPATH=. STEREOFINE_TEST_LANGUAGE=en xvfb-run -a -s '-screen 0 1920x1080x24' python tests/gui_smoke_xvfb.py

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install portable ExifTool
        shell: pwsh
        run: |
          $version = '${{ env.EXIFTOOL_VERSION }}'
          $url = "https://sourceforge.net/projects/exiftool/files/exiftool-${version}_64.zip/download"
          curl.exe -fL $url -o exiftool.zip
          Expand-Archive exiftool.zip -DestinationPath exiftool-download
          $pkg = Get-ChildItem exiftool-download -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item -Recurse -Force (Join-Path $pkg.FullName '*') tools
          $exe = Get-ChildItem tools -File | Where-Object { $_.Name -like 'exiftool*.exe' } | Select-Object -First 1
          if (-not $exe) { throw 'ExifTool executable not found after extraction' }
          Rename-Item -Force $exe.FullName 'exiftool.exe'
          & .\tools\exiftool.exe -ver
      - name: Build portable Windows release
        shell: pwsh
        run: .\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StereoFine_1.1-rc2_Windows_x64
          path: release/StereoFine_1.1-rc2_Windows_x64.zip
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare portable ExifTool
        run: |
          VERSION='${{ env.EXIFTOOL_VERSION }}'
          ARCHIVE="Image-ExifTool-${VERSION}.tar.gz"
          curl -fL "https://sourceforge.net/projects/exiftool/files/${ARCHIVE}/download" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          mkdir -p portable-tools/lib
          cp "Image-ExifTool-${VERSION}/exiftool" portable-tools/exiftool
          cp -R "Image-ExifTool-${VERSION}/lib/." portable-tools/lib/
          chmod +x portable-tools/exiftool
          perl portable-tools/exiftool -ver
      - name: Build Linux x64
        run: |
          python scripts/package_source.py "$RUNNER_TEMP/StereoFine-Source"
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name StereoFine \
            --collect-data customtkinter \
            --add-data 'assets:assets' \
            StereoFine.py
          mkdir -p dist/StereoFine/tools
          cp -R portable-tools/* dist/StereoFine/tools/
          cp README_DE.md README_EN.md LICENSE.txt THIRD_PARTY_NOTICES.md dist/StereoFine/
          cp -R licenses dist/StereoFine/licenses
          cp -R "$RUNNER_TEMP/StereoFine-Source" dist/StereoFine/Source
          python scripts/package_source.py --verify dist/StereoFine/Source
          tar -C dist -czf StereoFine_1.1-rc2_Linux_x64.tar.gz StereoFine
      - uses: actions/upload-artifact@v4
        with:
          name: StereoFine_1.1-rc2_Linux_x64
          path: StereoFine_1.1-rc2_Linux_x64.tar.gz
          if-no-files-found: error

  mac-arm64:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare portable ExifTool
        run: |
          VERSION='${{ env.EXIFTOOL_VERSION }}'
          ARCHIVE="Image-ExifTool-${VERSION}.tar.gz"
          curl -fL "https://sourceforge.net/projects/exiftool/files/${ARCHIVE}/download" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          mkdir -p portable-tools/lib
          cp "Image-ExifTool-${VERSION}/exiftool" portable-tools/exiftool
          cp -R "Image-ExifTool-${VERSION}/lib/." portable-tools/lib/
          chmod +x portable-tools/exiftool
          perl portable-tools/exiftool -ver
      - name: Build macOS Apple Silicon
        run: |
          python scripts/package_source.py "$RUNNER_TEMP/StereoFine-Source"
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name StereoFine \
            --collect-data customtkinter \
            --add-data 'assets:assets' \
            --icon assets/stereofine.icns \
            StereoFine.py
          APP='dist/StereoFine.app'
          test -d "$APP"
          mkdir -p "$APP/Contents/MacOS/tools"
          cp -R portable-tools/* "$APP/Contents/MacOS/tools/"
          mkdir -p package/StereoFine
          cp -R "$APP" package/StereoFine/
          cp README_DE.md README_EN.md LICENSE.txt THIRD_PARTY_NOTICES.md package/StereoFine/
          cp -R licenses package/StereoFine/licenses
          cp -R "$RUNNER_TEMP/StereoFine-Source" package/StereoFine/Source
          python scripts/package_source.py --verify package/StereoFine/Source
          ditto -c -k --sequesterRsrc --keepParent package/StereoFine StereoFine_1.1-rc2_macOS_AppleSilicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StereoFine_1.1-rc2_macOS_AppleSilicon
          path: StereoFine_1.1-rc2_macOS_AppleSilicon.zip
          if-no-files-found: error

  mac-intel:
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare portable ExifTool
        run: |
          VERSION='${{ env.EXIFTOOL_VERSION }}'
          ARCHIVE="Image-ExifTool-${VERSION}.tar.gz"
          curl -fL "https://sourceforge.net/projects/exiftool/files/${ARCHIVE}/download" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          mkdir -p portable-tools/lib
          cp "Image-ExifTool-${VERSION}/exiftool" portable-tools/exiftool
          cp -R "Image-ExifTool-${VERSION}/lib/." portable-tools/lib/
          chmod +x portable-tools/exiftool
          perl portable-tools/exiftool -ver
      - name: Build macOS Intel
        run: |
          python scripts/package_source.py "$RUNNER_TEMP/StereoFine-Source"
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name StereoFine \
            --collect-data customtkinter \
            --add-data 'assets:assets' \
            --icon assets/stereofine.icns \
            StereoFine.py
          APP='dist/StereoFine.app'
          test -d "$APP"
          mkdir -p "$APP/Contents/MacOS/tools"
          cp -R portable-tools/* "$APP/Contents/MacOS/tools/"
          mkdir -p package/StereoFine
          cp -R "$APP" package/StereoFine/
          cp README_DE.md README_EN.md LICENSE.txt THIRD_PARTY_NOTICES.md package/StereoFine/
          cp -R licenses package/StereoFine/licenses
          cp -R "$RUNNER_TEMP/StereoFine-Source" package/StereoFine/Source
          python scripts/package_source.py --verify package/StereoFine/Source
          ditto -c -k --sequesterRsrc --keepParent package/StereoFine StereoFine_1.1-rc2_macOS_Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StereoFine_1.1-rc2_macOS_Intel
          path: StereoFine_1.1-rc2_macOS_Intel.zip
          if-no-files-found: error

  release:
    needs: [windows, linux, mac-arm64, mac-intel]
    if: github.ref == 'refs/heads/development/1.1'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: StereoFine_1.1-rc2_*
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1-rc2 artifacts/* \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title 'StereoFine 1.1 RC2 – Testbuild' \
            --notes-file RELEASE_NOTES_1.1-rc2.md
          python - <<'PYRC'
          from pathlib import Path
          previous = Path('RELEASE_NOTES_1.1-rc1.md').read_text(encoding='utf-8')
          notice = '**Ersetzt durch [RC2](https://github.com/muelli1975/StereoFine/releases/tag/v1.1-rc2).** Bei RC1 enthielten die Linux-/macOS-Quellpakete eine von PyInstaller erzeugte Builddatei statt der unveränderten Repository-Datei. RC2 korrigiert die Paketierung; die Bildverarbeitung ist unverändert.\n\n'
          Path('/tmp/rc1-superseded.md').write_text(notice + previous, encoding='utf-8')
          PYRC
          gh release edit v1.1-rc1 --prerelease --latest=false \
            --title 'StereoFine 1.1 RC1 – ersetzt durch RC2' \
            --notes-file /tmp/rc1-superseded.md
