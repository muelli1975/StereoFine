name: StereoFine 1.4 color preview experiment
on:
  push:
    branches: [benchmark/color-preview-1.4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: bench
      - uses: actions/checkout@v4
        with:
          ref: ae982703fb3223ea7b52ec67b3c50bdadd20873c
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install the pinned application dependencies
        working-directory: app
        run: python -m pip install -r requirements-lock.txt psutil==7.0.0
      - name: Measure color fitting using the existing alignment matches
        working-directory: app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item ../bench/tools/benchmark_cpu_batch.py tools/benchmark_cpu_batch.py
          Copy-Item ../bench/tools/benchmark_color_preview.py tools/benchmark_color_preview.py
          Copy-Item ../bench/tools/benchmark_color_reuse.py tools/benchmark_color_reuse.py
          python -m tools.benchmark_color_reuse
      - uses: actions/upload-artifact@v4
        with:
          name: stereofine-color-reuse-results
          path: app/color-reuse-results.json
          if-no-files-found: error
