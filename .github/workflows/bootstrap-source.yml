name: Bootstrap StereoFine source

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/RUN'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble, decode and verify source snapshot
        run: |
          cat bootstrap/source.part-* > /tmp/stereofine_source_text.tar.gz.b64
          base64 -d /tmp/stereofine_source_text.tar.gz.b64 > /tmp/stereofine_source_text.tar.gz
          echo '7c7e009714ee719bd4db85e01a76be2ad8bd30cd5f3d7a40a6054695b12df0ef  /tmp/stereofine_source_text.tar.gz' | sha256sum -c -
      - name: Expand normal repository files
        run: |
          tar -xzf /tmp/stereofine_source_text.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit StereoFine 1.0 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish StereoFine 1.0 source' || exit 0
          git push
