name: Retarget StereoFine v1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retarget-v1.yml'

permissions:
  contents: write

jobs:
  retarget:
    if: github.event.head_commit.message == 'Prepare v1.0 retarget'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time workflow and retarget v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/retarget-v1.yml
          git commit -m 'Remove one-time v1.0 retarget workflow'
          git push origin HEAD:main
          TARGET=$(git rev-parse HEAD)
          git tag -f v1.0 "$TARGET"
          git push origin -f refs/tags/v1.0
          gh release edit v1.0 --target "$TARGET"
          echo "v1.0 -> $TARGET"
