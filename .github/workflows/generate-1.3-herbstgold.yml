name: Generate StereoFine 1.3 Herbstgold source asset
on:
  push:
    branches: [build/1.3-herbstgold]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install numpy==2.4.6 opencv-python-headless==4.13.0.92
      - name: Generate and register the Cube asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_herbstgold.py
          sha256sum assets/luts/Herbstgold.cube
          git hash-object assets/luts/Herbstgold.cube
          python -c 'import base64,json,pathlib; print(json.dumps(dict(encoding="base64",content=base64.b64encode(pathlib.Path("assets/luts/Herbstgold.cube").read_bytes()).decode())))' |
            gh api --method POST "/repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha
