name: Apply F favorite shortcut

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-f-shortcut.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare F favorite shortcut'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Apply narrowly scoped shortcut patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          p = root / 'stereofine/gui.py'
          s = p.read_text(encoding='utf-8')
          old = '''        self.bind_all("<a>", self._on_a)\n        self.bind_all("<A>", self._on_a)\n        self.bind_all("<KeyRelease-a>", lambda e: self._release_shortcut_key("a"))\n        self.bind_all("<KeyRelease-A>", lambda e: self._release_shortcut_key("a"))\n        self.bind_all("<g>", self._on_g)\n'''
          new = '''        self.bind_all("<a>", self._on_a)\n        self.bind_all("<A>", self._on_a)\n        self.bind_all("<KeyRelease-a>", lambda e: self._release_shortcut_key("a"))\n        self.bind_all("<KeyRelease-A>", lambda e: self._release_shortcut_key("a"))\n        self.bind_all("<f>", self._on_f)\n        self.bind_all("<F>", self._on_f)\n        self.bind_all("<KeyRelease-f>", lambda e: self._release_shortcut_key("f"))\n        self.bind_all("<KeyRelease-F>", lambda e: self._release_shortcut_key("f"))\n        self.bind_all("<g>", self._on_g)\n'''
          if old not in s:
              raise SystemExit('Expected A/G shortcut block not found')
          s = s.replace(old, new, 1)
          old = '''    def _on_a(self, event=None):\n        if self.busy_state != "idle" or not self._claim_shortcut_key("a", event):\n            return "break"\n        self.preview_mode.set("Graustufen" if self.preview_mode.get() == "Farbig" else "Farbig")\n        self._on_preview_mode_changed()\n        return "break"\n\n    def _on_g(self, event=None):\n'''
          new = '''    def _on_a(self, event=None):\n        if self.busy_state != "idle" or not self._claim_shortcut_key("a", event):\n            return "break"\n        self.preview_mode.set("Graustufen" if self.preview_mode.get() == "Farbig" else "Farbig")\n        self._on_preview_mode_changed()\n        return "break"\n\n    def _on_f(self, event=None):\n        if self.busy_state != "idle" or not self._claim_shortcut_key("f", event):\n            return "break"\n        return self._on_favorite_clicked(event)\n\n    def _on_g(self, event=None):\n'''
          if old not in s:
              raise SystemExit('Expected _on_a/_on_g block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = root / 'stereofine/i18n.py'
          s = p.read_text(encoding='utf-8')
          de_old = '            "  Enter                   Aktuelles Bild speichern\\n\\n"\n'
          en_old = '            "  Enter                   Save current image\\n\\n"\n'
          if de_old not in s or en_old not in s:
              raise SystemExit('Expected help text lines not found')
          s = s.replace(de_old, '            "  Enter                   Aktuelles Bild speichern\\n"\n            "  F                       Favorit setzen/entfernen\\n\\n"\n', 1)
          s = s.replace(en_old, '            "  Enter                   Save current image\\n"\n            "  F                       Toggle favorite\\n\\n"\n', 1)
          p.write_text(s, encoding='utf-8')

          for name in ('README.md', 'README_EN.md'):
              p = root / name
              s = p.read_text(encoding='utf-8')
              old = '- `Enter` – save current image\n'
              if old not in s:
                  raise SystemExit(f'Expected keyboard line not found in {name}')
              p.write_text(s.replace(old, old + '- `F` – toggle favorite\n', 1), encoding='utf-8')

          p = root / 'README_DE.md'
          s = p.read_text(encoding='utf-8')
          old = '- `Enter` – aktuelles Bild speichern\n'
          if old not in s:
              raise SystemExit('Expected keyboard line not found in README_DE.md')
          p.write_text(s.replace(old, old + '- `F` – Favorit setzen/entfernen\n', 1), encoding='utf-8')

          p = root / 'tests/test_release_hygiene.py'
          s = p.read_text(encoding='utf-8')
          needle = '    def test_release_ui_regressions_are_explicitly_guarded(self):\n'
          insert = '''    def test_f_shortcut_toggles_existing_favorite_action(self):\n        gui_source = (ROOT / "stereofine" / "gui.py").read_text(encoding="utf-8")\n        i18n_source = (ROOT / "stereofine" / "i18n.py").read_text(encoding="utf-8")\n        self.assertIn('self.bind_all("<f>", self._on_f)', gui_source)\n        self.assertIn('self.bind_all("<F>", self._on_f)', gui_source)\n        self.assertIn('self.bind_all("<KeyRelease-f>", lambda e: self._release_shortcut_key("f"))', gui_source)\n        self.assertIn('def _on_f(self, event=None):', gui_source)\n        self.assertIn('_claim_shortcut_key("f", event)', gui_source)\n        self.assertIn('return self._on_favorite_clicked(event)', gui_source)\n        self.assertIn('F                       Favorit setzen/entfernen', i18n_source)\n        self.assertIn('F                       Toggle favorite', i18n_source)\n        self.assertIn('`F` – toggle favorite', (ROOT / "README_EN.md").read_text(encoding="utf-8"))\n        self.assertIn('`F` – Favorit setzen/entfernen', (ROOT / "README_DE.md").read_text(encoding="utf-8"))\n\n'''
          if needle not in s or 'test_f_shortcut_toggles_existing_favorite_action' in s:
              raise SystemExit('Unexpected release hygiene test state')
          p.write_text(s.replace(needle, insert + needle, 1), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify tests and imports
        run: |
          python -m compileall -q StereoFine.py stereofine tests
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit verified shortcut patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stereofine/gui.py stereofine/i18n.py README.md README_DE.md README_EN.md tests/test_release_hygiene.py
          git diff --cached --check
          git commit -m 'Add F favorite shortcut'
          git push origin HEAD:main
