name: Verify StereoFine title bars

on:
  pull_request:
    paths:
      - 'stereofine/titlebar.py'
      - 'tests/gui_final_update.py'
      - 'tests/gui_macos_title_bar.py'
      - '.github/workflows/title-bar-check.yml'

permissions:
  contents: read

jobs:
  windows-title-bar:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install the existing StereoFine dependencies
        run: python -m pip install -r requirements-lock.txt -r requirements-heif.txt
      - name: Build the native color manager
        run: python scripts/prepare_lcms.py
      - name: Check native fullscreen exits and title colors
        run: python -m tests.gui_final_update
      - uses: actions/upload-artifact@v4
        with:
          name: StereoFine-title-bar-check
          path: build/gui-final-update-win32.json
          if-no-files-found: error

  macos-title-bar:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Check the native AppKit appearance
        run: python -m tests.gui_macos_title_bar
