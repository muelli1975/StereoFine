name: Generate StereoFine macOS icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-macos-icon.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install Pillow
        run: python -m pip install Pillow==12.2.0
      - name: Generate native ICNS
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Image.open("assets/stereofine.ico")
          sizes = sorted(src.ico.sizes())
          base_size = max(sizes, key=lambda s: s[0] * s[1])
          base = src.ico.getimage(base_size).convert("RGBA")

          iconset = Path("StereoFine.iconset")
          iconset.mkdir(exist_ok=True)
          targets = {
              "icon_16x16.png": 16,
              "icon_16x16@2x.png": 32,
              "icon_32x32.png": 32,
              "icon_32x32@2x.png": 64,
              "icon_128x128.png": 128,
              "icon_128x128@2x.png": 256,
              "icon_256x256.png": 256,
              "icon_256x256@2x.png": 512,
              "icon_512x512.png": 512,
              "icon_512x512@2x.png": 1024,
          }
          for name, size in targets.items():
              image = base if base.size == (size, size) else base.resize((size, size), Image.Resampling.LANCZOS)
              image.save(iconset / name, "PNG")

          print("ICO source sizes:", sizes)
          print("Using source frame:", base_size)
          PY
          iconutil -c icns StereoFine.iconset -o assets/stereofine.icns
          rm -rf StereoFine.iconset
          iconutil -c iconset assets/stereofine.icns -o StereoFine-verify.iconset
          test -f StereoFine-verify.iconset/icon_256x256.png
          rm -rf StereoFine-verify.iconset
          ls -lh assets/stereofine.icns
      - name: Commit generated ICNS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stereofine.icns
          if git diff --cached --quiet; then
            echo "No icon change needed."
          else
            git commit -m "Add native macOS application icon"
            git push origin HEAD:main
          fi
