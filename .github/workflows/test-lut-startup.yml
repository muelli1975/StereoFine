name: Verify Windows LUT settings and folder behavior
on:
  push:
    branches: [test/lut-startup-1.3]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-lock.txt -r requirements-heif.txt
      - run: python scripts/prepare_lcms.py
      - run: python -m unittest tests.test_looks_13 tests.test_preferences_13
      - name: Exercise the GUI twice
        run: |
          1..2 | ForEach-Object {
            python -m tests.gui_controls_13
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
