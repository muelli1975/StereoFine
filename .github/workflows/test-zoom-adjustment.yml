name: Check high-resolution zoom refresh
on:
  push:
    branches: [test/zoom-manual-adjustment]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-lock.txt -r requirements-heif.txt
      - run: python scripts/prepare_lcms.py
      - name: Measure 24 megapixels per eye
        run: python -u -m tests.gui_zoom_latency_probe
