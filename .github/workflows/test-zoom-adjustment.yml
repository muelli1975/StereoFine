name: Check manual adjustment in zoomed views
on:
  push:
    branches: [test/zoom-manual-adjustment]
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-lock.txt -r requirements-heif.txt
      - run: python scripts/prepare_lcms.py
      - name: Check native keyboard handling on Windows
        if: runner.os == 'Windows'
        run: python -u -m tests.gui_controls_13
      - name: Check native keyboard handling on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          PYTHONPATH=. xvfb-run -a -s '-screen 0 1920x1080x24' python -u -m tests.gui_controls_13
