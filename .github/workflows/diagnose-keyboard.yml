name: Diagnose native keyboard focus
on:
  push:
    branches: [diagnostics/1.1-keyboard-focus]
permissions:
  contents: read
jobs:
  focus:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-lock.txt -r requirements-heif.txt
      - run: python -m tests.gui_keyboard_filename
