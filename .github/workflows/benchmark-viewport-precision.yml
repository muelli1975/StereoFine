name: StereoFine 1.4 Windows viewport precision

on:
  push:
    branches:
      - benchmark/batch-worker-count-1.4
    paths:
      - .github/workflows/benchmark-viewport-precision.yml
      - tools/benchmark_viewport_precision.py

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -u -m tools.benchmark_viewport_precision
