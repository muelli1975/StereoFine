name: Publish verified StereoFine 1.1

on:
  workflow_dispatch:
  push:
    branches: [release/1.1]
    paths: ['.github/workflows/publish-1.1.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-stereofine-1.1
  cancel-in-progress: false

env:
  RELEASE_COMMIT: ef735bc6d1d98db046d41672f09ae87ee48eac6c
  CANDIDATE_RUN: '39594205017'
  EXPECTED_MAIN: 942fddd09989ed9fb374fb50892854ed63380556
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Require successful validation of the exact source commit
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > candidate-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/jobs?per_page=100" > candidate-jobs.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('candidate-run.json').read_text())
          jobs = json.loads(Path('candidate-jobs.json').read_text())['jobs']
          assert run['head_sha'] == os.environ['RELEASE_COMMIT']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert len(jobs) == 8 and all(j['conclusion'] == 'success' for j in jobs)
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN }}
          pattern: StereoFine-1.1-candidate-*
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN }}
          pattern: StereoFine-input-check-*
          path: input-reports
      - name: Verify every archive, source byte, asset and extracted-package report
        run: |
          python scripts/release_checksums.py artifacts
          python scripts/verify_release_packages.py artifacts > archive-checks.jsonl
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = {name: digest for digest, name in (line.split() for line in Path('artifacts/SHA256SUMS.txt').read_text().splitlines())}
          platforms = ['windows-2022', 'ubuntu-22.04', 'macos-15', 'macos-15-intel']
          reports = []
          sources = {'stereo_pair.heic', 'entity_groups.heic', 'pattern_webp.webp', 'pattern_bmp.bmp', 'spatial_photo.heic', 'arrow.heic'}
          for platform in platforms:
              root = Path('input-reports')/('StereoFine-input-check-'+platform)
              before = json.loads((root/'candidate-input-check.json').read_text())
              after = json.loads((root/'candidate-extracted-input-check.json').read_text())
              archive = json.loads((root/'candidate-archive-check.json').read_text())
              assert before == after and after['ok'] and after['codec_isolated']
              assert {item['source'] for item in after['checks']} == sources
              assert all(item.get('metadata_success', True) for item in after['checks'])
              assert archive['passed'] and archive['extracted_input_checks']
              assert archive['gui_startup_survived_seconds'] >= 6
              assert archive['sha256'] == manifest[archive['archive']]
              reports.append(dict(platform=platform, archive=archive, input_checks=after))
          result = dict(version='1.1', source_commit=os.environ['RELEASE_COMMIT'],
                        validation_run=int(os.environ['CANDIDATE_RUN']),
                        validation_url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['CANDIDATE_RUN'],
                        application_tests_per_platform=198, research_tests_per_platform=48,
                        gui_layout_smoke='German and English on Linux',
                        gui_startup='Extracted executable kept running for six seconds on each package target',
                        archives=[json.loads(line) for line in Path('archive-checks.jsonl').read_text().splitlines()],
                        packages=reports)
          Path('BUILD_CHECKS.json').write_text(json.dumps(result, indent=2)+'\n')
          notes = Path('RELEASE_NOTES_1.1.md').read_text()
          notes += '\n## Validation\n\n198 application and 48 research tests passed on each of Windows, Linux and macOS. All four native archives passed source/asset/architecture verification and repeated input/session/export checks after extraction. German/English GUI smoke passed on Linux; extracted executable startup was checked on every target.\n\n[Build validation]('+result['validation_url']+'). Detailed results are attached as `BUILD_CHECKS.json`.\n\n## SHA-256\n\n```text\n'+Path('artifacts/SHA256SUMS.txt').read_text()+'```\n'
          Path('release-body.md').write_text(notes)
          PY
      - name: Create a draft with only the verified release assets
        run: |
          if gh release view v1.1 --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > existing-release.json 2>/dev/null; then
            python - <<'PYDRAFT'
          import json, os
          from pathlib import Path
          existing = json.loads(Path('existing-release.json').read_text())
          assert existing['isDraft'] and existing['targetCommitish'] == os.environ['RELEASE_COMMIT'], 'Refusing to modify a published or different release'
          PYDRAFT
          else
            gh release create v1.1 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
              --draft --title 'StereoFine 1.1' --notes-file release-body.md
          fi
          gh release upload v1.1 --clobber \
            artifacts/StereoFine_1.1_Windows_x64.zip \
            artifacts/StereoFine_1.1_Linux_x64.tar.gz \
            artifacts/StereoFine_1.1_macOS_AppleSilicon.zip \
            artifacts/StereoFine_1.1_macOS_Intel.zip \
            artifacts/SHA256SUMS.txt BUILD_CHECKS.json \
            --repo "$GITHUB_REPOSITORY"
      - name: Download the uploaded assets and verify their actual bytes
        run: |
          gh release download v1.1 --repo "$GITHUB_REPOSITORY" --dir uploaded-verification
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = [Path('artifacts')/name for name in ['StereoFine_1.1_Windows_x64.zip', 'StereoFine_1.1_Linux_x64.tar.gz', 'StereoFine_1.1_macOS_AppleSilicon.zip', 'StereoFine_1.1_macOS_Intel.zip', 'SHA256SUMS.txt']]+[Path('BUILD_CHECKS.json')]
          actual = Path('uploaded-verification')
          assert {p.name for p in actual.iterdir()} == {p.name for p in expected}
          for path in expected:
              def digest(value):
                  with value.open('rb') as stream:
                      return hashlib.file_digest(stream, 'sha256').hexdigest()
              assert digest(path) == digest(actual/path.name), path.name
          PY
      - name: Promote the verified source and publish 1.1
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$EXPECTED_MAIN" ] && [ "$current" != "$RELEASE_COMMIT" ]; then
            echo 'main changed during validation; the verified release remains a draft.' >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
            -f sha="$RELEASE_COMMIT" -F force=false
          gh release edit v1.1 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/v1.1" --jq .sha)" = "$RELEASE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1" --jq '{url: .html_url, draft: .draft, prerelease: .prerelease, assets: [.assets[].name]}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StereoFine-1.1-publication-evidence
          path: |
            BUILD_CHECKS.json
            release-body.md
            artifacts/SHA256SUMS.txt
          if-no-files-found: warn
