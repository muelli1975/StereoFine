name: StereoFine 1.4 Windows performance benchmark

on:
  push:
    branches: [benchmark/cpu-batch-1.4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: bench
      - uses: actions/checkout@v4
        with:
          ref: 5f109a8d275c4f03562bc1000386a6c822fa783e
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install pinned application and measurement dependencies
        working-directory: app
        run: python -m pip install -r requirements-lock.txt psutil==7.0.0
      - name: Prepare official ExifTool for Windows
        working-directory: app
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 --retry-all-errors --retry-delay 2 'https://sourceforge.net/projects/exiftool/files/exiftool-13.59_64.zip/download' -o exiftool.zip
          Expand-Archive exiftool.zip -DestinationPath exiftool-download
          $pkg = Get-ChildItem exiftool-download -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item -Recurse -Force (Join-Path $pkg.FullName '*') tools
          $exe = Get-ChildItem tools -File | Where-Object { $_.Name -like 'exiftool*.exe' } | Select-Object -First 1
          if (-not $exe) { throw 'ExifTool executable not found' }
          Rename-Item -Force $exe.FullName 'exiftool.exe'
          & .\tools\exiftool.exe -ver
      - name: Measure browsing and batch analysis with export
        working-directory: app
        shell: pwsh
        run: |
          Copy-Item ../bench/tools/benchmark_cpu_batch.py tools/benchmark_cpu_batch.py
          python -m tools.benchmark_cpu_batch
      - uses: actions/upload-artifact@v4
        with:
          name: stereofine-windows-performance
          path: app/cpu-batch-results.json
          if-no-files-found: error
