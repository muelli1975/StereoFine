name: Refresh the verified StereoFine 1.3 release
on:
  push:
    branches: [publish/1.3-refresh]
permissions:
  actions: read
  contents: write
concurrency:
  group: stereofine-v1-3-publication
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'muelli1975/StereoFine'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      UPDATE_SOURCE_SHA: 36093d9961715b972458aaca46fdc4d3aa9d289c
      CANDIDATE_RUN: '42509106062'
    steps:
      - name: Require the exact successful candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            run=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN")
            jq -e --arg sha "$UPDATE_SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '.head_sha == $sha and .head_branch == "development/1.3" and .head_repository.full_name == $repo and (.path | split("@")[0]) == ".github/workflows/prepare-release.yml"' \
              <<< "$run" > /dev/null
            status=$(jq -r .status <<< "$run")
            conclusion=$(jq -r .conclusion <<< "$run")
            echo "Candidate run: $status $conclusion"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 30
          done
          echo 'Candidate did not complete in time' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: 36093d9961715b972458aaca46fdc4d3aa9d289c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42509106062
          pattern: StereoFine-1.3-candidate-*
          path: release
          merge-multiple: true
      - name: Recheck archives, exact source snapshot and SHA-256 manifest
        run: |
          test "$(git rev-parse HEAD)" = "$UPDATE_SOURCE_SHA"
          cmp README.md README_EN.md
          cp release/SHA256SUMS.txt "$RUNNER_TEMP/candidate-sha256.txt"
          (cd release && sha256sum -c SHA256SUMS.txt)
          python scripts/release_checksums.py release
          cmp release/SHA256SUMS.txt "$RUNNER_TEMP/candidate-sha256.txt"
          python scripts/verify_release_packages.py release
      - name: Stage, verify and promote the refreshed public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/update-v1.3.json" <<'JSON'
          {
            "repository": "muelli1975/StereoFine",
            "tag": "v1.3",
            "branch": "development/1.3",
            "previous_tag": "df64ef8aaf78e73a58feffcaf1a47392f7e76260",
            "release_id": 437692632,
            "notes_file": "RELEASE_NOTES_1.3.md",
            "assets": {
              "SHA256SUMS.txt": "sha256:aa0174ef38fe879e7a3642e3790ec7291ed6a75bb3837ddfee9efcb251e4e649",
              "StereoFine_1.3_Linux_x64.tar.gz": "sha256:beb24c55eceadc010cf951c47d59ceba044a570738cc540586838797ad2130e1",
              "StereoFine_1.3_macOS_AppleSilicon.zip": "sha256:663184f784b42d05bd2db2d4873f8cada97f0757ca14c6fa51f960d80f970d96",
              "StereoFine_1.3_macOS_Intel.zip": "sha256:9aa9479f313f0d53bedf19286a4334c7827b40850e50aeb1aee01a13e3c8454f",
              "StereoFine_1.3_Windows_x64.zip": "sha256:cd53d4d3418ccc9bb8076dc1e02a67add49bfc63ceb419d6deb777dbbf03709a"
            },
            "replace": [
              "SHA256SUMS.txt",
              "StereoFine_1.3_Linux_x64.tar.gz",
              "StereoFine_1.3_macOS_AppleSilicon.zip",
              "StereoFine_1.3_macOS_Intel.zip",
              "StereoFine_1.3_Windows_x64.zip"
            ]
          }
          JSON
          python scripts/publish_update.py --root release --config "$RUNNER_TEMP/update-v1.3.json"
