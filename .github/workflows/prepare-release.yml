name: Prepare StereoFine 1.3 candidates

on:
  workflow_dispatch:
  push:
    branches: [development/1.3]

permissions:
  contents: read

concurrency:
  group: stereofine-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checked-platforms:
    uses: ./.github/workflows/validate-development.yml
    with:
      candidate: true

  checksums:
    needs: checked-platforms
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          pattern: StereoFine-1.3-candidate-*
          path: release
          merge-multiple: true
      - name: Verify complete candidate set and write checksums
        run: |
          python scripts/release_checksums.py release
          python scripts/verify_release_packages.py release > release/ARCHIVE_CHECKS.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: StereoFine-1.3-candidate-checksums
          path: |
            release/SHA256SUMS.txt
            release/ARCHIVE_CHECKS.jsonl
          if-no-files-found: error
