name: Prepare StereoFine 1.4 candidates

on:
  workflow_dispatch:
  push:
    branches: [development/1.4, main]

permissions:
  contents: read

concurrency:
  group: stereofine-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checked-platforms:
    if: github.ref != 'refs/heads/main' || github.event.head_commit.message == 'Refresh StereoFine 1.4' || github.event.head_commit.message == 'Refresh StereoFine 1.4 title bars'
    uses: ./.github/workflows/validate-development.yml
    with:
      candidate: true

  checksums:
    needs: checked-platforms
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          pattern: StereoFine-candidate-*
          path: release
          merge-multiple: true
      - name: Verify complete candidate set and write checksums
        run: |
          python scripts/release_checksums.py release
          python scripts/verify_release_packages.py release > release/ARCHIVE_CHECKS.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: StereoFine-1.4-candidate-checksums
          path: |
            release/SHA256SUMS.txt
            release/ARCHIVE_CHECKS.jsonl
          if-no-files-found: error

  publish-refresh:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Refresh StereoFine 1.4'
    needs: checksums
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          pattern: StereoFine-candidate-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: StereoFine-1.4-candidate-checksums
          path: release
      - name: Refresh the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_update.py --root release --config scripts/release_update_1.4.json

  publish-title-bar-update:
    needs: checksums
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Refresh StereoFine 1.4 title bars'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: StereoFine-candidate-*
          path: release-files
          merge-multiple: true
      - name: Update the existing release with the checked Windows and macOS packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_title_bar_update.py --root release-files --config .github/title-bar-update.json
